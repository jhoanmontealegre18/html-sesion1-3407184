<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARD</title>
    <style>


* {
    margin:auto;
    padding: 0;
    width: auto;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}
:root { 
    --white_color: rgb(255, 255, 255);
    --orange_color: rgb(255, 165, 89);
    --orange_dark_color: rgb(255, 96, 0);
    --black_color: rgb(69, 69, 69);
    --background_color: linear-gradient(to top left, #b156d9, #213780);
    --font_color : rgb(255, 230, 199);
}
.container {
    width: 100%;
    min-height: 100vh;
    background-image:var(--background_color);
    padding-bottom: 1rem;
}
header {
    padding: 2rem 0;
    margin: 0 3rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
}
h1 {
    color:white;
    text-align: center;
    padding: 1rem;
    border-bottom:orange solid;
    text-transform: uppercase;
}
.cards_box {
    margin: 0 5rem;
    padding: 3.5rem 5rem;
}

botton {
    text-decoration: none;
}  

img {
    display: block;
    max-width: 100%;
    height: auto;
}

.cards {
    max-width: 1120px;
    border-radius: 1.25rem;
    overflow: hidden;
}
  
.card_details {
    width: 300px;
    border-radius: 1.25rem;
    overflow: hidden;
}
  
.card_img_box {
    position: center;
    display: block;
    width: 100%;
    background-color:orange;
    padding-top: .75rem;
    margin-bottom: -.75rem;
    margin-left: auto;
    margin-right: auto;
    margin-top: -100px;
    border: #ee8b0a solid 15px;
}
  
.card_data {
    background: var(--black_color);
    padding: 1.5rem 2rem;
    border-radius: 1rem;
    text-align: center;
    position: relative;
}
  

   
.card_name {
    font-size: 1rem;
    color: var(--font_color);
    margin-bottom: .75rem;
}
  
.card_description {
    font-weight: 500;
    margin-bottom: 1.75rem;
    color:white;
}
  
.card_button {
    display: inline-block;
    background-color:orange;
    padding: .75rem 1.5rem;
    border-radius: .25rem;
    color:white;
    font-weight: 600;
} 
 
.swiper-button-next:hover {
    color: orange;
}
  
.swiper-button-prev {
    left: 0;
}
  
.swiper-button-next {
    right: 0;
}
  
.swiper-pagination-bullet {
    background-color:orange;
    opacity: 1;
}
.card_button:hover {
    background-color:orange;
}

    </style>
</head>
<body>
  <div class="container">
    <div class="hero_section">
      <div class="cards_box swiper">
        <div class="cards">
           <div class="swiper-wrapper">

              <section class="card_details swiper-slide">
              
                    <img class="card_img_box" src="pabloescobar.jpg"alt="retrato">
               
                 <div class="card_data">
                    <h3 class="card_name">Sebastian Rodriguez</h3>
                    <p class="card_description">
                     Software engineer who knows how to solve problems in difficult
                     circumstances and specializes in working under pressure.
                    </p>
                    <a  class="card_button">Follow me </a>
                 </div>
              <section class="card_details swiper-slide"
                                            

</body>   
</html>
